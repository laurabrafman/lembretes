<!doctype html>
<html lang="pt-BR" data-tema="pixel">
<head>
<meta charset="utf-8">
<title>Pausa</title>
<link rel="stylesheet" href="base.css">
<style>
  html, body { background: transparent; overflow: hidden; }
  body { padding: 8px 16px 16px 8px; }
  .card { position: relative; height: 100%; display: flex; flex-direction: column; background: var(--paper); border: var(--borda); box-shadow: 8px 8px 0 var(--ink); }
  .winbar { position: relative; flex: none; }
  .x { position: absolute; right: 6px; top: 2px; width: 20px; height: 20px; display: grid; place-items: center; border: var(--borda); background: var(--paper); font-family: var(--pixel); font-size: 11px; line-height: 1; }
  .x:hover { background: var(--ink); color: var(--paper); }
  #passo { flex: 1; display: flex; flex-direction: column; padding: 20px 28px 22px; min-height: 0; }
  #passo.entra { animation: entra .24s steps(3); }
  @keyframes entra { from { opacity: 0; } }

  .eyebrow { display: inline-block; align-self: flex-start; padding: 2px 10px; background: var(--ink); color: var(--paper); font-size: 13px; font-weight: 600; }
  h1 { font-family: var(--pixel); font-size: 44px; font-weight: 400; line-height: 1.1; margin-top: 14px; }
  .lead { color: var(--ink-soft); margin-top: 10px; }
  .bloco { margin-top: 24px; }
  .rotulo { display: block; font-family: var(--pixel); font-size: 22px; margin-bottom: 12px; }

  .nota { display: flex; align-items: baseline; justify-content: center; gap: 6px; }
  .nota-n { font-family: var(--pixel); font-size: 88px; line-height: 1; }
  .nota-de { font-family: var(--pixel); font-size: 22px; color: var(--ink-soft); }
  .nota-escala { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-soft); margin-top: 6px; }

  .acoes { display: flex; align-items: center; gap: 14px; margin-top: auto; padding-top: 20px; flex-wrap: wrap; }
  .sp { flex: 1; }
  .b { height: 46px; padding: 0 20px; border: var(--borda); background: var(--paper); box-shadow: var(--sombra); font-size: 15px; font-weight: 600; position: relative; top: 0; left: 0; }
  .b:active { top: 3px; left: 3px; box-shadow: none; }
  .b-main { background: var(--ink); color: var(--paper); }
  .b:disabled { opacity: .4; pointer-events: none; }
  .b.pronto { animation: chama .5s steps(1) 6; }
  @keyframes chama { 50% { background: var(--paper); color: var(--ink); } }
  .b-link { font-size: 14px; text-decoration: underline; text-underline-offset: 3px; padding: 2px 4px; color: var(--ink); }
  .b-link:hover { background: var(--ink); color: var(--paper); text-decoration: none; }

  .mantra-grande { font-family: var(--pixel); font-size: 33px; line-height: 1.35; margin-top: 26px; padding: 18px 20px; border: 2px dashed var(--ink); }

  .respira-topo { display: flex; align-items: center; gap: 24px; }
  .respira { flex: none; }
  .bolha { display: none; }     /* no pixel quem respira é a personagem */
  .palco { width: 152px; padding: 4px; border: var(--borda); background:
    radial-gradient(color-mix(in srgb, var(--ink) 22%, transparent) 1px, transparent 1.4px) 0 0 / 8px 8px; }
  .sprite { width: 144px; height: 144px; background-size: 100% 100%; image-rendering: pixelated; filter: var(--sprite-filtro); }
  .sprite[data-estado="respirando"][data-quadro="1"] { background-image: url("sprites/respirando-1.png"); }
  .sprite[data-estado="respirando"][data-quadro="2"] { background-image: url("sprites/respirando-2.png"); }
  .sprite[data-estado="respirando"][data-quadro="3"] { background-image: url("sprites/respirando-3.png"); }
  .sprite[data-estado="respirando"][data-quadro="4"] { background-image: url("sprites/respirando-4.png"); }
  .sprite[data-estado="sorrindo"] { background-image: url("sprites/sorrindo.png"); }
  .fase { font-family: var(--pixel); font-size: 55px; line-height: 1; }
  .conta { font-family: var(--pixel); font-size: 33px; color: var(--ink-soft); margin-top: 6px; }
  .timer { margin-top: 16px; font-size: 14px; }
  .timer .num { font-family: var(--pixel); font-size: 22px; background: var(--ink); color: var(--paper); padding: 0 6px; margin-right: 6px; }

  .inp { width: 100%; height: 150px; padding: 12px 14px; border: var(--borda); border-radius: 0; outline: none; resize: none;
    background-color: var(--paper); color: var(--ink); font: inherit; font-size: 14px; line-height: 1.55; }
  .inp::placeholder { color: var(--ink-soft); }
  .inp:focus {
    border-color: transparent;
    background-image: linear-gradient(90deg, var(--ink) 50%, transparent 50%), linear-gradient(90deg, var(--ink) 50%, transparent 50%),
      linear-gradient(0deg, var(--ink) 50%, transparent 50%), linear-gradient(0deg, var(--ink) 50%, transparent 50%);
    background-repeat: repeat-x, repeat-x, repeat-y, repeat-y; background-size: 8px 2px, 8px 2px, 2px 8px, 2px 8px;
    background-position: 0 0, 0 100%, 0 0, 100% 0; animation: formigas .8s steps(4) infinite;
  }
  .nunca { display: flex; justify-content: space-between; gap: 10px; margin-top: 10px; font-size: 13px; }
  .nunca span:first-child { padding: 2px 8px; border: var(--borda); }
  #salvo { font-weight: 600; white-space: nowrap; }

  .decisoes { display: flex; flex-direction: column; gap: 12px; }
  .decisoes .b { width: 100%; }
  .nota-rodape { font-size: 13px; color: var(--ink-soft); margin-top: 12px; text-align: center; }
  .final { margin: auto 0; text-align: center; }
  .final .palco { margin: 0 auto 10px; }

  #habilidades { position: absolute; inset: 26px 0 0; z-index: 5; display: none; padding: 16px;
    background: repeating-conic-gradient(color-mix(in srgb, var(--ink) 30%, transparent) 0 25%, transparent 0 50%) 0 0 / 4px 4px; }
  #habilidades.on { display: block; }
  .hab-janela { height: 100%; display: flex; flex-direction: column; background: var(--paper); border: var(--borda); box-shadow: 6px 6px 0 var(--ink); }
  .hab-topo { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; background: var(--ink); color: var(--paper); font-family: var(--pixel); font-size: 22px; }
  .hab-topo .x { position: static; border-color: var(--paper); background: var(--ink); color: var(--paper); }
  .hab-lista { overflow-y: auto; padding: 4px 16px 16px; }
  .hab { padding: 14px 0; border-top: 2px dashed var(--ink-soft); }
  .hab:first-child { border-top: 0; }
  .hab-t { font-family: var(--pixel); font-size: 33px; line-height: 1.1; }
  .hab-s { font-size: 13px; color: var(--ink-soft); margin-bottom: 8px; }
  .hab-i { display: grid; grid-template-columns: 160px 1fr; gap: 10px; padding: 4px 0; font-size: 14px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="inverte" color-interpolation-filters="sRGB">
    <feColorMatrix type="matrix" values="-1 0 0 0 1.157  0 -1 0 0 1.180  0 0 -1 0 1.016  0 0 0 1 0"/>
  </filter>
</svg>
<div class="card" id="card">
  <div class="winbar pywebview-drag-region"><span class="winbar-t">Pausa</span><button class="x" id="fechar" title="Fechar (sempre pode)" aria-label="Fechar">×</button></div>
  <div id="passo"></div>
  <div id="habilidades"></div>
</div>
<script src="pausa.js"></script>
</body>
</html>
