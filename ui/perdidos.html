<!doctype html>
<html lang="pt-BR" data-tema="pixel">
<head>
<meta charset="utf-8">
<title>Lembretes perdidos</title>
<link rel="stylesheet" href="base.css">
<style>
  html, body { background: transparent; overflow: hidden; }
  body { padding: 8px 16px 16px 8px; }
  .janela { height: 100%; display: flex; flex-direction: column; background: var(--paper); border: var(--borda); box-shadow: 8px 8px 0 var(--ink); }
  .corpo { flex: 1; display: flex; flex-direction: column; padding: 18px 22px 20px; min-height: 0; }
  h1 { font-family: var(--pixel); font-size: 33px; font-weight: 400; line-height: 1.1; }
  .sub { color: var(--ink-soft); margin-top: 8px; }
  .lista { margin-top: 16px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .it { display: flex; align-items: center; gap: 14px; padding: 8px 12px; border: var(--borda); }
  .it .h { font-family: var(--pixel); font-size: 22px; width: 64px; flex: none; }
  .it .m { font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .it .d { font-size: 13px; color: var(--ink-soft); text-transform: capitalize; }
  .foot { display: flex; gap: 12px; padding-top: 16px; }
  .b { flex: 1; height: 44px; border: var(--borda); background: var(--paper); box-shadow: var(--sombra); font-weight: 600; position: relative; top: 0; left: 0; }
  .b:active { top: 3px; left: 3px; box-shadow: none; }
  .b-main { background: var(--ink); color: var(--paper); }

  .it { flex-wrap: wrap; }
  .acoes-it { display: flex; gap: 8px; width: 100%; padding-left: 78px; }
  .mini-b { height: 28px; padding: 0 10px; border: var(--borda); font-size: 13px; font-weight: 600; background: var(--paper); }
  .mini-b:first-child { background: var(--ink); color: var(--paper); }
  .mini-b:active { transform: translate(2px, 2px); }
  .modo-np h1 { font-size: 22px; line-height: 1.3; }
</style>
</head>
<body>
<div class="janela">
  <div class="winbar pywebview-drag-region"><span class="winbar-t">Enquanto você estava fora</span></div>
  <div class="corpo">
    <h1 id="t"></h1>
    <p class="sub" id="sub">Seu Mac estava dormindo ou desligado na hora destes lembretes. Tudo bem.</p>
    <div class="lista" id="lista"></div>
    <div class="foot" id="foot">
      <button class="b" onclick="pywebview.api.abrir_app()">Abrir Lembretes</button>
      <button class="b b-main" id="ok">Entendi</button>
    </div>
  </div>
</div>
<script src="perdidos.js"></script>
</body>
</html>
